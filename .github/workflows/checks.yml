# dxnd's full check suite, called by PR Checks and the Verify deploy gate, as Platform's is.
# Ember's own CI (ci.yml) runs only in NYLLON-SOFTWARE/ember-cloudflare, so this copy runs these.
name: Checks

on:
  workflow_call:

jobs:
  check:
    name: Typecheck, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ember/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          path: ./
          extra_args: --only-verified

  # Named after the tested tree (not the commit) so a merge that lands exactly this code finds it.
  # Only reached when every check passed.
  record-verified:
    name: Record Verified Tree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [check, e2e, secret-scan]
    steps:
      - uses: actions/checkout@v5
      - name: Resolve tree
        id: tree
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - name: Write record
        run: echo "commit=$(git rev-parse HEAD) run=${{ github.run_id }} event=${{ github.event_name }}" > verified.txt
      - uses: actions/upload-artifact@v6
        with:
          name: verified-tree-${{ steps.tree.outputs.tree }}
          path: verified.txt
          retention-days: 30
          overwrite: true
