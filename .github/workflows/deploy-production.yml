name: Deploy Production

# Deploys the irc.dxnd.ai branch, this copy's default, to the Worker ember-production, which serves irc.dxnd.ai, after the Verify gate, as
# Platform's Deploy API Production does. Merging Update Ember's pull requests deploys Ember's releases.
# Needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets in the production environment or
# the repository. The first deploy takes its setup token from an EMBER_SETUP_TOKEN secret
# (`openssl rand -hex 32`), since this log may be public and the deploy prints no token into it.
# RESEND_API_KEY, TURNSTILE_SITE_KEY and TURNSTILE_SECRET_KEY secrets go up too when set.
on:
  push:
    branches: [irc.dxnd.ai]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/verify.yml

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    needs: verify
    environment:
      name: production
      url: https://irc.dxnd.ai
    env:
      WORKER_NAME: ember-production
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Require irc.dxnd.ai
        if: github.ref != 'refs/heads/irc.dxnd.ai'
        run: |
          echo "::error::Production deploys only from irc.dxnd.ai, not ${GITHUB_REF}"
          exit 1
      # Pinned to commits, as Ember's own deploy workflows are, because this job holds the Cloudflare token.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Deploy
        id: deploy
        env:
          # Only this step sees the token and the secrets, not the install or build scripts.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EMBER_SETUP_TOKEN: ${{ secrets.EMBER_SETUP_TOKEN }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
        run: |
          node apps/worker/scripts/deploy.ts --name "$WORKER_NAME" --var "GIT_REVISION:${GITHUB_SHA::7}" --var "GIT_BRANCH:${GITHUB_REF_NAME}"
          url=$(jq -rn 'first(inputs | select(.type == "deploy") | .targets[]? | select(endswith(".workers.dev")))' "$WRANGLER_OUTPUT_FILE_PATH")
          if [ -z "$url" ]; then
            echo "::error::wrangler deployed $WORKER_NAME without a workers.dev URL"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Check the deploy
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: node apps/worker/scripts/check-deploy.ts "$DEPLOY_URL"

  # Write scope lives here, away from the job that runs pnpm with production secrets.
  tag:
    name: Tag Deploy
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: write
    steps:
      - name: Tag successful deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="prod-${GITHUB_SHA::7}-${GITHUB_RUN_ID}"
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${TAG}" -f sha="${GITHUB_SHA}"
